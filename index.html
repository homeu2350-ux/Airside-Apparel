<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Clothing</title> <!-- CHANGE: Website Title -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <h2 class="logo">Velocity Clothing</h2> <!-- CHANGE: Logo Text -->
        <ul>
            <li><a href="#">Home</a></li> <!-- CHANGE: Navbar Links -->
            <li><a href="#">Shop</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Clean • Simple • Modern Apparel</h1> <!-- CHANGE: Hero Text -->
        <p>Designed for comfort and style.</p> <!-- CHANGE: Subtext -->
        <button class="hero-btn">Shop Now</button> <!-- CHANGE: Button Text -->
    </section>

    <!-- PRODUCT GRID -->
    <section class="product-grid">

        <!-- PRODUCT CARD 1 -->
        <div class="product-card">
            <img src="shirt1.png" alt="YHZ Shirt"> <!-- CHANGE: Image File -->
            <h2>YHZ Airport Tee</h2> <!-- CHANGE: Product Name -->
            <p class="price">$29.99</p> <!-- CHANGE: Price -->
            <button class="buy-btn">View Item</button> <!-- CHANGE: Button -->
        </div>

        <!-- PRODUCT CARD 2 -->
        <div class="product-card">
            <img src="shirt2.png" alt="Velocity Tee"> <!-- CHANGE: Image File -->
            <h2>Velocity Logo Tee</h2> <!-- CHANGE: Product Name -->
            <p class="price">$24.99</p> <!-- CHANGE: Price -->
            <button class="buy-btn">View Item</button>
        </div>

        <!-- PRODUCT CARD 3 -->
        <div class="product-card">
            <img src="hoodie1.png" alt="Hoodie"> <!-- CHANGE: Image File -->
            <h2>Classic Hoodie</h2> <!-- CHANGE: Product Name -->
            <p class="price">$49.99</p> <!-- CHANGE: Price -->
            <button class="buy-btn">View Item</button>
        </div>

    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Velocity Clothing — All Rights Reserved</p> <!-- CHANGE: Footer Text -->
    </footer>

    <script src="script.js"></script>
</body>
</html>
